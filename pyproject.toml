[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bayesian"
version = "1.0.0"
description = "Bayesian ML platform: uncertainty-aware modeling and serving from scratch — Laplace logistic regression, MCMC posterior checks, Thompson-sampling bandits, calibration, cost-aware decisioning, drift monitoring, gated registry"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.29,<1",
    "pydantic>=2.6,<3",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<9", "httpx>=0.27,<1"]

[project.scripts]
bayesian-ml-platform = "bayesian.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
